spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:./.env[.properties]

server.port=${PORT:5000}
spring.data.mongodb.uri=${MONGO_URI}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt-secret=${JWT_SECRET}
app.seed-on-startup=${SEED_ON_STARTUP:false}
app.super-admin.name=${SUPER_ADMIN_NAME}
app.super-admin.email=${SUPER_ADMIN_EMAIL}
app.super-admin.password=${SUPER_ADMIN_PASSWORD}
